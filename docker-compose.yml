services:
  db:
    container_name: MariaDB
    image: mariadb:latest
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql

  mediawiki:
    container_name: MediaWiki
    image: mediawiki:stable-fpm-alpine
    restart: always
    volumes:
      - ./mediawiki:/var/www/html
    depends_on:
      - db
    env_file: .env

  nginx:
    container_name: nginx
    image: nginx:alpine-slim
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mediawiki:/var/www/html
    depends_on:
      - mediawiki

volumes:
  db_data:
